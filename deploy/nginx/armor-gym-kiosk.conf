# nginx config for the Armor Gym kiosk VM. Installed as
# /etc/nginx/sites-available/armor-gym-kiosk and symlinked into sites-enabled.
#
# This is the plain-HTTP version. certbot --nginx edits the installed copy to
# add HTTPS and the http->https redirect, so the installed file will differ
# from this one after certbot runs. To change domains, replace the two
# server_name values and run certbot again for the new names.

# Medusa: Store API, admin (/app), auth, and the Coinos webhook (/hooks).
server {
    listen 80;
    listen [::]:80;
    server_name api.paywithbitcoin.lol;

    # Admin product image uploads.
    client_max_body_size 20m;

    # The bare API address opens the admin (Medusa has no page at its root).
    # 302, not 301, so browsers don't cache it if the admin path changes.
    location = / {
        return 302 /app;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}

# Kiosk storefront: the static Vite build, copied to /var/www/kiosk.
server {
    listen 80;
    listen [::]:80;
    server_name paywithbitcoin.lol;

    root /var/www/kiosk;
    index index.html;

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The service worker and the HTML must always be revalidated, or the
    # tablet can stay on an old build after a deploy.
    location ~ ^/(sw\.js|workbox-[^/]+\.js|registerSW\.js|index\.html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
