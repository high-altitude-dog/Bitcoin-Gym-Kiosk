# Per-IP request limits (Oct 30, 2026), installed as
# /etc/nginx/conf.d/armor-gym-ratelimits.conf (http context). Sized from the
# tablet's busiest minute so far: 137 requests, 120 of them payment polls,
# 14 line-item changes, 3 invoices. A request whose key is empty isn't counted,
# so each zone only sees the requests its map picks. /hooks/* (Coinos, Bark Pay
# webhooks) is never limited. Over a limit nginx answers 429.
limit_req_status 429;
limit_req_log_level warn;

map $uri $kiosk_store_key {
    ~^/store/  $binary_remote_addr;
    default    "";
}
map "$request_method $uri" $kiosk_cart_key {
    "~^POST /store/carts$"  $binary_remote_addr;
    default                 "";
}
map "$request_method $uri" $kiosk_line_key {
    "~^POST /store/carts/[^/]+/line-items"  $binary_remote_addr;
    default                                 "";
}
map "$request_method $uri" $kiosk_invoice_key {
    "~^POST /store/payment-collections"  $binary_remote_addr;
    default                              "";
}
map "$request_method $uri" $kiosk_cash_key {
    "~^POST /store/cash-"  $binary_remote_addr;
    default                "";
}
# Medusa admin login (/auth/...) and Bark Pay's (/login, /admin/login).
map "$request_method $uri" $login_key {
    "~^POST /auth/"              $binary_remote_addr;
    "~^POST /(admin/)?login$"    $binary_remote_addr;
    default                      "";
}

limit_req_zone $kiosk_store_key   zone=kiosk_store:10m   rate=10r/s;
limit_req_zone $kiosk_cart_key    zone=kiosk_cart:10m    rate=10r/m;
limit_req_zone $kiosk_line_key    zone=kiosk_line:10m    rate=120r/m;
limit_req_zone $kiosk_invoice_key zone=kiosk_invoice:10m rate=10r/m;
limit_req_zone $kiosk_cash_key    zone=kiosk_cash:10m    rate=10r/m;
limit_req_zone $login_key         zone=logins:10m        rate=5r/m;
