# Security headers (Oct 30, 2026), installed as
# /etc/nginx/snippets/armor-security-headers.conf. Include it in every HTTPS
# server block, and again in any location that has its own add_header (nginx
# drops the server's add_header lines in such a location).
# HSTS starts at one day; raise max-age once the domain is settled.
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
