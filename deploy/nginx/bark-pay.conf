# Bark Pay (self-hosted Ark/Lightning payment processor) at bark.paywithbitcoin.lol.
# Plain-HTTP version: certbot adds TLS and the HTTP->HTTPS redirect to the installed
# copy (/etc/nginx/sites-available/bark-pay). Bark Pay itself listens on
# 127.0.0.1:8080 only (APP_PORT in ~/bark-pay/.env); BARKPAY_TRUSTED_PROXY_HOPS=2
# because this proxy sits in front of the container's own Caddy.

server {
    listen 80;
    listen [::]:80;
    server_name bark.paywithbitcoin.lol;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
